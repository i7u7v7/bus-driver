  .top-left{
    position:fixed;
    top:calc(22px + env(safe-area-inset-top, 0px));
    left:26px;
    color:#fff;
    font-size:13px;
    font-weight:500;
    letter-spacing:.3px;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
    z-index:5;
  }

  .top-center{
    position:fixed;
    top:calc(24px + env(safe-area-inset-top, 0px));
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:6px;
    color:#fff;
    font-size:12px;
    font-weight:500;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
    z-index:5;
    white-space:nowrap;
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#3ddc60;
    box-shadow:0 0 6px #3ddc60;
  }

  .top-right{
    position:fixed;
    top:calc(20px + env(safe-area-inset-top, 0px));
    right:26px;
    display:flex;
    align-items:center;
    gap:6px;
    color:#fff;
    font-size:12px;
    font-weight:600;
    background:rgba(0,0,0,.28);
    padding:6px 12px;
    border-radius:20px;
    backdrop-filter:blur(6px);
    z-index:5;
  }

  .center-title{
    position:fixed;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:3;
    text-align:center;
    color:#fff;
    font-family:'Noto Sans Devanagari','Inter',sans-serif;
    font-weight:900;
    line-height:1.15;
    text-shadow:
      0 4px 24px rgba(0,0,0,.55),
      0 2px 6px rgba(0,0,0,.5);
    letter-spacing:1px;
    user-select:none;
    width:90%;
  }

  .player-bar{
    position:fixed;
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    left:50%;
    transform:translateX(-50%);
    width:min(560px, 88vw);
    background:linear-gradient(180deg, rgba(30,20,15,.75), rgba(10,6,4,.9));
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    z-index:10;
  }

  .art{
    width:44px;
    height:44px;
    border-radius:8px;
    background:linear-gradient(135deg,#ffb347,#ff5e62);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
    overflow:hidden;
  }
  .art span{filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}

  .meta{
    flex:1;
    min-width:0;
    color:#fff;
  }

  .meta .name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .meta .artist{
    font-size:12px;
    color:rgba(255,255,255,.65);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:1px;
  }

  .meta .time{
    font-size:10px;
    color:rgba(255,255,255,.45);
    margin-top:4px;
    font-variant-numeric:tabular-nums;
  }

  .transport{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }

  .tbtn{
    width:30px;
    height:30px;
    border:none;
    background:rgba(255,255,255,.08);
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:13px;
    transition:background .15s ease, transform .1s ease;
  }
  .tbtn:hover{background:rgba(255,255,255,.18);}
  .tbtn:active{transform:scale(.92);}

  .tbtn.play{
    width:38px;
    height:38px;
    background:#fff;
    color:#111;
    font-size:15px;
  }
  .tbtn.play:hover{background:#f0f0f0;}

  .progress-track{
    position:absolute;
    left:16px;
    right:16px;
    bottom:2px;
    height:2px;
    background:rgba(255,255,255,.15);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ffb347,#ff5e62);
  }

  #ytplayer{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
  }

  /* fluid title size: scales smoothly with viewport instead of one breakpoint jump */
  .center-title{
    font-size:clamp(32px, 9vw, 88px);
  }

  @media (max-width:480px){
    .top-left, .top-right{font-size:11px;}
    .top-center{font-size:10px;}
    .top-right{padding:5px 10px;}
    .player-bar{
      bottom:calc(14px + env(safe-area-inset-bottom, 0px));
      padding:10px 12px;
      gap:10px;
      width:92vw;
    }
    .art{width:38px;height:38px;font-size:17px;}
    .meta .name{font-size:13px;}
    .meta .artist{font-size:11px;}
    .tbtn{width:28px;height:28px;font-size:12px;}
    .tbtn.play{width:34px;height:34px;font-size:14px;}
  }

  @media (max-width:340px){
    .top-center{display:none;}
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="frame">
  <div class="top-left" id="clock">4:50 pm</div>
  <div class="top-center"><span class="dot"></span><span id="onlineCount">77 tracks in playlist</span></div>
  <a class="top-right" href="https://www.youtube.com/playlist?list=PL0umg_TNpoZTTdZVIi5tfX69pRmoMFGna" target="_blank" rel="noopener" style="text-decoration:none;">▶ YT Music</a>

  <div class="center-title">बस ड्राइवर</div>

  <div class="player-bar">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="art"><span>🚌</span></div>
    <div class="meta">
      <div class="name" id="songName">Loading playlist...</div>
      <div class="artist" id="songArtist">Indian Bus Driver's Playlist</div>
      <div class="time" id="songTime">0:00 / 0:00</div>
    </div>
    <div class="transport">
      <button class="tbtn" id="prevBtn">⏮</button>
      <button class="tbtn play" id="playBtn">▶</button>
      <button class="tbtn" id="nextBtn">⏭</button>
    </div>
  </div>
</div>

<div id="ytplayer"></div>

<script>
  const PLAYLIST_ID = "PL0umg_TNpoZTTdZVIi5tfX69pRmoMFGna";
  let player;
  let isPlaying = false;
  let progressTimer;
  let apiReady = false;

  function setStatus(msg){
    document.getElementById('songName').textContent = msg;
  }

  setStatus("Connecting to YouTube…");

  function loadYT(){
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    tag.onerror = function(){
      setStatus("Couldn't reach YouTube — check your internet connection.");
    };
    document.body.appendChild(tag);
  }
  loadYT();

  // Safety net: if the API script never calls back, tell the user instead of staying silent
  setTimeout(function(){
    if(!apiReady){
      setStatus("YouTube player didn't load. Try opening this page in a normal browser tab (not a file preview) and reload.");
    }
  }, 6000);

  window.onYouTubeIframeAPIReady = function(){
    apiReady = true;
    player = new YT.Player('ytplayer', {
      height: '1',
      width: '1',
      playerVars: {
        listType: 'playlist',
        list: PLAYLIST_ID,
        autoplay: 0,
        controls: 0,
        disablekb: 1,
        modestbranding: 1,
        rel: 0,
        origin: window.location.origin
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onError: onPlayerError
      }
    });
  };

  function onPlayerReady(e){
    e.target.setVolume(80);
    setStatus("Ready — press ▶ to play");
  }

  function onPlayerError(e){
    // 2 = invalid id, 5 = html5 error, 100 = removed/private, 101/150 = embedding disabled by owner
    const code = e.data;
    let msg = "This track can't play here — skipping…";
    if(code === 101 || code === 150){
      msg = "This song's owner blocked outside playback — skipping…";
    } else if(code === 100){
      msg = "This song was removed or made private — skipping…";
    }
    setStatus(msg);
    setTimeout(function(){
      if(player && player.nextVideo) player.nextVideo();
    }, 900);
  }

  function fmt(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return m + ":" + s;
  }

  function updateNowPlaying(){
    try{
      const data = player.getVideoData();
      const title = (data && data.title) ? data.title : "Loading track...";
      document.getElementById('songName').textContent = title;
      const idx = player.getPlaylistIndex();
      const list = player.getPlaylist();
      const total = list ? list.length : 77;
      document.getElementById('songArtist').textContent =
        "Track " + (idx >= 0 ? idx + 1 : "--") + " of " + total;
    }catch(err){}
  }

  function tickProgress(){
    try{
      const dur = player.getDuration();
      const cur = player.getCurrentTime();
      const pct = dur ? (cur/dur)*100 : 0;
      document.getElementById('progressFill').style.width = pct + "%";
      document.getElementById('songTime').textContent = fmt(cur) + " / " + fmt(dur);
    }catch(err){}
  }

  function onPlayerStateChange(e){
    const playBtn = document.getElementById('playBtn');

    if(e.data === YT.PlayerState.PLAYING){
      isPlaying = true;
      playBtn.textContent = "❚❚";
      updateNowPlaying();
      clearInterval(progressTimer);
      progressTimer = setInterval(tickProgress, 500);
    } else if(e.data === YT.PlayerState.PAUSED){
      isPlaying = false;
      playBtn.textContent = "▶";
      clearInterval(progressTimer);
    } else if(e.data === YT.PlayerState.BUFFERING){
      document.getElementById('songName').textContent = "Loading (ad or track)...";
    } else if(e.data === YT.PlayerState.ENDED){
      playBtn.textContent = "▶";
      clearInterval(progressTimer);
    } else if(e.data === YT.PlayerState.CUED){
      updateNowPlaying();
    }
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    if(!player || !player.getPlayerState) return;
    if(isPlaying){
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if(player && player.nextVideo) player.nextVideo();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if(player && player.previousVideo) player.previousVideo();
  });

  // live clock top-left, matching reference style
  function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12; if(h === 0) h = 12;
    document.getElementById('clock').textContent = h + ":" + m + " " + ampm;
  }
  updateClock();
  setInterval(updateClock, 30000);
</script>

</body>
</html>
